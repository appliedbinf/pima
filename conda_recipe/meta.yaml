{% set name = "pima" %}
{% set data = load_setup_py_data(setup_file='../setup.py', from_recipe_dir=True) %}

package:
  name: "{{ name|lower }}"
  version: "{{ data.get('version') }}"

source:
  # git_url: https://github.com/appliedbinf/MergedPima.git
  # git_tag: development
  path: ../


build:
  number: 1
  skip: True  # [win]

requirements:
  host:
    - python==3.12.13 # triggers python_abi errors if mismatched with run environment?
    - pip

  run:
    - git==2.53.0
    - gawk==5.3.1
    - ncbi-amrfinderplus==4.2.7
    - bedtools==2.31.1
    - biopython==1.87
    - blast==2.16.0
    - bwa==0.7.19
    - curl==8.19.0
    - flye==2.9.6
    - raven-assembler==1.8.3
    - mdutils==1.8.1
    - minimap2==2.30
    - multiprocess==0.70.19
    - mummer==3.23
    - kraken2==2.17.1
    - spades==4.2.0
    - pandas==3.0.2
    - pandoc==3.9.0.2
    - weasyprint==67.0 #pdf engine for pandoc
    - pango==1.56.4
    - pathos==0.3.5
    - python==3.12.13 #,<3.9
    - pyfaidx==0.9.0.4
    - pybedtools==0.12
    - python_circos==0.2.0 # will replace with the development verison using pip in pima_install.sh script
    - r
    - r-hash #needed for pChunks
    - r-stringr #needed for pChunks
    - r-gridextra #needed for pChunks
    - r-optparse #needed for pChunks
    - samtools==1.23.1 #needs to be the conda-forge version and NOT the bioconda version
    - varscan==2.4.6
    - medaka==2.2.1 #bumped to get access to the inspect model tools
    - setuptools==82.0.1 #82 breaks a medaka version
    - pilon==1.24
    - polypolish==0.6.1
    - quast==5.3.0 #installs perl-circos as a dependency...
    - nextflow==25.10.4 # used for parallelizing multiplex runs
    
test:

  commands:
    - minimap2 -h
    - pima -h

about:
  home: https://githib.com/appliedbinf/MergedPima
  License: MIT


